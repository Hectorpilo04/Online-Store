<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OlivosExpress</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .acciones {
      display: flex;
      gap: 18px;
    }

    .icono {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }

    .buscador {
      display: none;
      padding: 15px 20px;
      border-bottom: 1px solid #ddd;
    }

    .buscador input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .hero {
      text-align: center;
      padding: 90px 20px;
      background: #f4f4f4;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #555;
      margin-bottom: 25px;
    }

    .boton {
      display: inline-block;
      background: #111;
      color: white;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 6px;
    }

    .productos {
      max-width: 1100px;
      margin: auto;
      padding: 55px 20px;
    }

    .productos h2 {
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .producto {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      background: white;
    }

    .producto img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .producto h3 {
      margin-top: 15px;
      margin-bottom: 8px;
    }

    .precio {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .comprar {
      width: 100%;
      padding: 12px;
      border: none;
      background: #111;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 40px;
      border-top: 1px solid #ddd;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">OLIVOSEXPRESS</div>

  <div class="acciones">
    <button class="icono" onclick="mostrarBuscador()">🔍</button>
    <button class="icono" onclick="mostrarCarrito()">🛒</button>
  </div>
</header>

<div class="buscador" id="buscador">
  <input
    type="text"
    id="buscar"
    placeholder="¿Qué estás buscando?"
    onkeyup="buscarProducto()"
  >
</div>

<section class="hero">
  <h1>OLIVOSEXPRESS</h1>
  <p>Todo lo que buscas, en un solo lugar.</p>
  <a class="boton" href="#productos">VER PRODUCTOS</a>
</section>

<section class="productos" id="productos">

  <h2>Productos destacados</h2>

  <div class="grid">

    <div class="producto" data-nombre="Auriculares inalámbricos">
      <img src="https://placehold.co/600x700?text=Auriculares">
      <h3>Auriculares inalámbricos</h3>
      <p class="precio">24,99 €</p>
      <button class="comprar" onclick="anadirCarrito('Auriculares inalámbricos')">
        Añadir al carrito
      </button>
    </div>

    <div class="producto" data-nombre="Botella térmica">
      <img src="https://placehold.co/600x700?text=Botella">
      <h3>Botella térmica</h3>
      <p class="precio">19,99 €</p>
      <button class="comprar" onclick="anadirCarrito('Botella térmica')">
        Añadir al carrito
      </button>
    </div>

    <div class="producto" data-nombre="Lámpara LED">
      <img src="https://placehold.co/600x700?text=Lampara">
      <h3>Lámpara LED</h3>
      <p class="precio">29,99 €</p>
      <button class="comprar" onclick="anadirCarrito('Lámpara LED')">
        Añadir al carrito
      </button>
    </div>

    <div class="producto" data-nombre="Soporte para móvil">
      <img src="https://placehold.co/600x700?text=Soporte">
      <h3>Soporte para móvil</h3>
      <p class="precio">14,99 €</p>
      <button class="comprar" onclick="anadirCarrito('Soporte para móvil')">
        Añadir al carrito
      </button>
    </div>

  </div>
</section>

<footer>
  © 2026 OlivosExpress
</footer>

<script>

  function mostrarBuscador() {
    const buscador = document.getElementById("buscador");

    if (buscador.style.display === "block") {
      buscador.style.display = "none";
    } else {
      buscador.style.display = "block";
      document.getElementById("buscar").focus();
    }
  }

  function buscarProducto() {

    const texto = document
      .getElementById("buscar")
      .value
      .toLowerCase();

    const productos = document.querySelectorAll(".producto");

    productos.forEach(producto => {

      const nombre = producto
        .dataset
        .nombre
        .toLowerCase();

      if (nombre.includes(texto)) {
        producto.style.display = "block";
      } else {
        producto.style.display = "none";
      }

    });
  }

  function anadirCarrito(producto) {
    alert(producto + " añadido al carrito.");
  }

  function mostrarCarrito() {
    alert("Tu carrito está vacío.");
  }

</script>

</body>
</html>
