<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #111;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .acciones {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 18px;
        }

        .buscador {
            display: none;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }

        .buscador input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: #f5f5f5;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #555;
            margin-bottom: 25px;
        }

        .hero a {
            display: inline-block;
            background: #111;
            color: white;
            padding: 14px 25px;
            text-decoration: none;
            border-radius: 5px;
        }

        .productos {
            padding: 50px 20px;
            max-width: 1100px;
            margin: auto;
        }

        .productos h2 {
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .producto {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
        }

        .producto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }

        .producto h3 {
            margin-top: 15px;
        }

        .precio {
            margin: 10px 0;
            font-weight: bold;
        }

        .comprar {
            width: 100%;
            background: #111;
            color: white;
            padding: 12px;
            border-radius: 5px;
            font-size: 15px;
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #ddd;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MI TIENDA</div>

    <div class="acciones">
        <button onclick="mostrarBuscador()">🔍</button>
        <button>🛒</button>
    </div>
</header>

<div class="buscador" id="buscador">
    <input 
        type="text" 
        id="buscar" 
        placeholder="Buscar productos..."
        onkeyup="buscarProducto()"
    >
</div>

<section class="hero">
    <h1>MI TIENDA</h1>
    <p>Descubre nuestros productos.</p>
    <a href="#productos">VER PRODUCTOS</a>
</section>

<section class="productos" id="productos">

    <h2>Productos</h2>

    <div class="grid" id="listaProductos">

        <div class="producto" data-nombre="Camiseta negra">
            <img src="https://via.placeholder.com/500x600">
            <h3>Camiseta negra</h3>
            <p class="precio">29,99 €</p>
            <button class="comprar">Añadir al carrito</button>
        </div>

        <div class="producto" data-nombre="Sudadera negra">
            <img src="https://via.placeholder.com/500x600">
            <h3>Sudadera negra</h3>
            <p class="precio">49,99 €</p>
            <button class="comprar">Añadir al carrito</button>
        </div>

        <div class="producto" data-nombre="Gorra">
            <img src="https://via.placeholder.com/500x600">
            <h3>Gorra</h3>
            <p class="precio">24,99 €</p>
            <button class="comprar">Añadir al carrito</button>
        </div>

    </div>

</section>

<footer>
    © 2026 Mi Tienda
</footer>

<script>
    function mostrarBuscador() {
        const buscador = document.getElementById("buscador");

        if (buscador.style.display === "block") {
            buscador.style.display = "none";
        } else {
            buscador.style.display = "block";
            document.getElementById("buscar").focus();
        }
    }

    function buscarProducto() {
        const texto = document
            .getElementById("buscar")
            .value
            .toLowerCase();

        const productos = document.querySelectorAll(".producto");

        productos.forEach(producto => {
            const nombre = producto.dataset.nombre.toLowerCase();

            if (nombre.includes(texto)) {
                producto.style.display = "block";
            } else {
                producto.style.display = "none";
            }
        });
    }
</script>

</body>
</html>
